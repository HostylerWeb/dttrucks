services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dttrucks
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dttrucks
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dttrucks -d dttrucks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
