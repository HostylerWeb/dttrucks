name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dttrucks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/dttrucks_test
      AUTH_SECRET: ci-test-secret-minimum-32-characters-long
      AUTH_URL: http://localhost:3000
      EMAIL_PROVIDER: smtp
      STORAGE_TYPE: local
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: DT Trucks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run db:generate

      - run: npx prisma migrate deploy

      - run: npm run db:seed

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        env:
          CI: true
          E2E_PORT: "3098"
          AUTH_URL: http://localhost:3098
          NEXT_PUBLIC_SITE_URL: http://localhost:3098
          SEED_ADMIN_EMAIL: admin@dttrucks.com
          SEED_ADMIN_PASSWORD: changeme
